name: CI/CD auf AWS ECS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24'

jobs:
  test:
    name: Test
    runs-on: [self-hosted, local-docker]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

  build:
    name: Build
    runs-on: [self-hosted, local-docker]
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktions-Build erstellen
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_IMGS: ${{ vars.VITE_IMGS || 'items' }}

      - name: Build-Artefakt hochladen
        continue-on-error: true   # Artefakt-Speicherquota des Accounts ist erschoepft; der Deploy-Job braucht das Artefakt nicht
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy-ecs:
    name: Image nach ECR pushen und ECS-Service aktualisieren
    runs-on: [self-hosted, local-docker]
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Learner Lab: kein OIDC möglich, daher die temporären Session-Credentials als Secrets.
      - name: AWS-Credentials aus Learner-Lab-Session beziehen
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Bei ECR anmelden
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image bauen und nach ECR pushen
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: biztrips
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_IMGS="${{ vars.VITE_IMGS || 'items' }}" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Task-Definition mit neuem Image aktualisieren
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: biztrips
          image: ${{ steps.ecr-login.outputs.registry }}/biztrips:${{ github.sha }}

      - name: ECS-Service deployen
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: biztrips-cluster
          service: biztrips-service
          wait-for-service-stability: true
